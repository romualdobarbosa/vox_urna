[project]
name = "vox-urna"
version = "0.1.0"
description = "Pipeline medallion sobre os boletins de urna do TSE e projeção do 2º turno presidencial de 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asn1tools>=0.169.0",
    "duckdb>=1.5,<2",
    "numpy>=2,<3",
    "requests>=2.34.2",
    "scipy>=1.14,<2",
]

[project.scripts]
vox-urna = "vox_urna.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dashboard = [
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "streamlit>=1.66.0",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff.lint.isort]
known-first-party = ["vox_urna", "dados", "mapa"]
